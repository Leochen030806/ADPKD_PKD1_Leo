<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGT-M STR 标注 Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #2d3748;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header-subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #1e293b;
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .sessions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .sessions-table thead {
            background: #f8fafc;
        }

        .sessions-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            font-size: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .sessions-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .sessions-table tr:hover {
            background: #f8fafc;
        }

        .marker-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-success {
            background: #d1fae5;
            color: #065f46;
        }

        .status-partial {
            background: #fef3c7;
            color: #92400e;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .quality-bar {
            display: flex;
            gap: 3px;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            flex: 1;
        }

        .quality-bar-fill {
            background: linear-gradient(90deg, #10b981, #667eea);
            transition: width 0.3s ease;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #64748b;
            font-size: 13px;
        }

        .metric-value {
            color: #1e293b;
            font-weight: 600;
            font-size: 14px;
            min-width: 80px;
            text-align: right;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .session-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .detail-card {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .detail-label {
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #1e293b;
            font-weight: 600;
            font-size: 14px;
        }

        .action-button {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🧬 PGT-M STR 等位基因标注 Dashboard</h1>
            <p class="header-subtitle">实时追踪所有样本的标注进度和质量指标</p>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalSessions">0</div>
                    <div class="stat-label">已完成会话</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalMarkersProcessed">0</div>
                    <div class="stat-label">处理标记数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgHetRate">0%</div>
                    <div class="stat-label">平均杂合率</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalSamplesAnnotated">0</div>
                    <div class="stat-label">标注样本数</div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Quality Distribution Chart -->
            <div class="card">
                <h2>质量分数分布</h2>
                <div class="chart-container">
                    <canvas id="qualityChart"></canvas>
                </div>
            </div>

            <!-- Het Rate by Marker -->
            <div class="card">
                <h2>标记杂合率</h2>
                <div class="chart-container">
                    <canvas id="hetRateChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Sessions Table -->
        <div class="card full-width">
            <h2>标注会话历史</h2>
            <table class="sessions-table">
                <thead>
                    <tr>
                        <th>Marker</th>
                        <th>Session ID</th>
                        <th>时间</th>
                        <th>模式</th>
                        <th>样本 (成功)</th>
                        <th>杂合率</th>
                        <th>质量</th>
                        <th>等位基因</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="sessionsBody">
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 40px; color: #94a3b8;">
                            <div class="empty-state">
                                <div class="empty-state-icon">📊</div>
                                <p>正在加载数据...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Session Details -->
        <div class="card full-width" style="display: none;" id="sessionDetailsCard">
            <h2>最新会话详情</h2>
            <div class="session-details" id="sessionDetailsContent"></div>
        </div>
    </div>

    <script>
        let qualityChart = null;
        let hetRateChart = null;

        // Load and display data
        async function loadDashboardData() {
            try {
                // Note: In a real implementation, this would fetch from a backend API
                // For now, we'll use sample data structure
                const sampleData = {
                    "total_sessions": 1,
                    "total_markers_processed": 1,
                    "summary_by_marker": {
                        "STR3": {
                            "marker_num": 3,
                            "marker_name": "STR 3",
                            "session_id": "STR3_MANUAL_20261002_112629",
                            "timestamp": new Date().toISOString(),
                            "annotation_mode": "manual",
                            "statistics": {
                                "total_samples": 16,
                                "annotated_samples": 15,
                                "successful_samples": 13,
                                "het_count": 13,
                                "hom_count": 0,
                                "het_rate": 1.0,
                                "mean_quality": 0.720,
                                "allele_count": 12
                            },
                            "report_path": "PKD1_STR3_Manual_Annotation_Report.html"
                        }
                    }
                };

                updateDashboard(sampleData);
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('sessionsBody').innerHTML =
                    '<tr><td colspan="9" style="text-align: center; padding: 20px; color: #ef4444;">加载数据失败</td></tr>';
            }
        }

        function updateDashboard(data) {
            // Update header stats
            document.getElementById('totalSessions').textContent = data.total_sessions;
            document.getElementById('totalMarkersProcessed').textContent = data.total_markers_processed;

            // Calculate averages
            let totalHetRate = 0;
            let totalSamples = 0;
            const sessions = [];

            for (const [key, session] of Object.entries(data.summary_by_marker)) {
                const stats = session.statistics;
                totalHetRate += stats.het_rate;
                totalSamples += stats.successful_samples;
                sessions.push({...session, marker_key: key});
            }

            const avgHetRate = sessions.length > 0 ? (totalHetRate / sessions.length * 100) : 0;
            document.getElementById('avgHetRate').textContent = avgHetRate.toFixed(1) + '%';
            document.getElementById('totalSamplesAnnotated').textContent = totalSamples;

            // Populate sessions table
            const tbody = document.getElementById('sessionsBody');
            if (sessions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 40px; color: #94a3b8;">暂无数据</td></tr>';
            } else {
                tbody.innerHTML = sessions.map(session => {
                    const stats = session.statistics;
                    const successRate = stats.total_samples > 0 ? (stats.successful_samples / stats.total_samples) : 0;
                    const statusClass = successRate === 1 ? 'status-success' : successRate >= 0.8 ? 'status-partial' : 'status-failed';
                    const statusText = successRate === 1 ? '完成' : successRate >= 0.8 ? '部分' : '失败';

                    return `
                        <tr>
                            <td><span class="marker-badge">${session.marker_name}</span></td>
                            <td><small>${session.session_id}</small></td>
                            <td><small>${new Date(session.timestamp).toLocaleString('zh-CN')}</small></td>
                            <td><small>${session.annotation_mode === 'manual' ? '🖱️ 手动' : '🤖 自动'}</small></td>
                            <td>${stats.successful_samples}/${stats.total_samples}</td>
                            <td>${(stats.het_rate * 100).toFixed(1)}%</td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <div class="quality-bar" style="width: 80px;">
                                        <div class="quality-bar-fill" style="width: ${stats.mean_quality * 100}%;"></div>
                                    </div>
                                    <small>${stats.mean_quality.toFixed(2)}</small>
                                </div>
                            </td>
                            <td>${stats.allele_count}</td>
                            <td>
                                <a href="${session.report_path}" class="action-button" target="_blank">📄 报告</a>
                            </td>
                        </tr>
                    `;
                }).join('');

                // Show details of most recent session
                if (sessions.length > 0) {
                    const latestSession = sessions[0];
                    showSessionDetails(latestSession);
                }
            }

            // Update charts
            updateCharts(sessions);
        }

        function showSessionDetails(session) {
            const card = document.getElementById('sessionDetailsCard');
            const content = document.getElementById('sessionDetailsContent');

            const stats = session.statistics;

            content.innerHTML = `
                <div class="detail-card">
                    <div class="detail-label">标记</div>
                    <div class="detail-value">${session.marker_name}</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">样本成功率</div>
                    <div class="detail-value">${(stats.successful_samples / stats.total_samples * 100).toFixed(1)}%</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">平均质量分数</div>
                    <div class="detail-value">${stats.mean_quality.toFixed(3)}</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">杂合率</div>
                    <div class="detail-value">${(stats.het_rate * 100).toFixed(1)}%</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">观察等位基因</div>
                    <div class="detail-value">${stats.allele_count} 个</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">标注模式</div>
                    <div class="detail-value">${session.annotation_mode === 'manual' ? '🖱️ 手动' : '🤖 自动'}</div>
                </div>
            `;

            card.style.display = 'block';
        }

        function updateCharts(sessions) {
            // Quality distribution chart
            const qualityCtx = document.getElementById('qualityChart').getContext('2d');
            if (qualityChart) {
                qualityChart.destroy();
            }

            qualityChart = new Chart(qualityCtx, {
                type: 'bar',
                data: {
                    labels: sessions.map(s => s.marker_name),
                    datasets: [{
                        label: '平均质量分数',
                        data: sessions.map(s => (s.statistics.mean_quality * 100).toFixed(1)),
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { callback: v => v + '%' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // Het rate chart
            const hetRateCtx = document.getElementById('hetRateChart').getContext('2d');
            if (hetRateChart) {
                hetRateChart.destroy();
            }

            hetRateChart = new Chart(hetRateCtx, {
                type: 'doughnut',
                data: {
                    labels: ['杂合子', '纯合子'],
                    datasets: [{
                        data: sessions.length > 0 ? [
                            sessions[0].statistics.het_count,
                            sessions[0].statistics.hom_count
                        ] : [0, 0],
                        backgroundColor: ['rgba(102, 126, 234, 0.8)', 'rgba(118, 75, 162, 0.8)'],
                        borderColor: ['rgba(102, 126, 234, 1)', 'rgba(118, 75, 162, 1)'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 15, font: { size: 12 } }
                        }
                    }
                }
            });
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', loadDashboardData);
    </script>
</body>
</html>

</body></html>
