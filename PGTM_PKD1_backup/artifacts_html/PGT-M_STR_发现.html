<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PGT-M STR 发现</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working screen. Left = genome map, funnel, candidate table; right = shortlist tray; locus drawer slides over the right edge. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface2:#edf0ee; --line:#d9dfdc; --fg:#15201c; --muted:#5d6b65;
  --accent:#0f6e66; --accent-soft:#d6ece8; --accent-fg:#ffffff;
  --tA:#1c5cab; --tA-fg:#ffffff; --tB:#6da7ec; --tBbg:#e3eefb; --tC:#898781; --tCbg:#ebece9; --tX:#d03b3b; --tXbg:#f8dedd;
  --sd:#d03b3b; --snp:#d9741f; --gene:#15201c;
  --ok:#0a7d0a; --warn:#946400; --bad:#c22f2f;
  --hl:#ffe066; --hl-fg:#15201c; --vcz:#8fdcd3; --seqlow:#8a9791;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1513; --surface:#17201d; --surface2:#1e2a26; --line:#2c3a35; --fg:#e6efeb; --muted:#9bada6;
    --accent:#3fc3b2; --accent-soft:#16403a; --accent-fg:#06211d;
    --tA:#9ec5f4; --tA-fg:#0b1d33; --tB:#3987e5; --tBbg:#17304f; --tC:#7d8a85; --tCbg:#222c28; --tX:#ef7b72; --tXbg:#43201d;
    --sd:#ef7b72; --snp:#f0a35e; --gene:#e6efeb;
    --ok:#4cc27c; --warn:#e0a73c; --bad:#ef7b72;
    --hl:#7a6a10; --hl-fg:#fff6c9; --vcz:#1d5f58; --seqlow:#7f908a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201d; --surface2:#1e2a26; --line:#2c3a35; --fg:#e6efeb; --muted:#9bada6;
  --accent:#3fc3b2; --accent-soft:#16403a; --accent-fg:#06211d;
  --tA:#9ec5f4; --tA-fg:#0b1d33; --tB:#3987e5; --tBbg:#17304f; --tC:#7d8a85; --tCbg:#222c28; --tX:#ef7b72; --tXbg:#43201d;
  --sd:#ef7b72; --snp:#f0a35e; --gene:#e6efeb;
  --ok:#4cc27c; --warn:#e0a73c; --bad:#ef7b72;
  --hl:#7a6a10; --hl-fg:#fff6c9; --vcz:#1d5f58; --seqlow:#7f908a;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:1480px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.01em}
h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h3{font-size:13px;font-weight:600;margin:0 0 6px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.ctl label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.ctl input[type=number],.ctl select,.tb input[type=search],.tb select{height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;min-width:0}
.ctl input[type=number]{width:72px}
.btn{height:30px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:26px;padding:0 8px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:8px 14px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:6px;padding:8px 10px;margin-bottom:12px}
.note b{color:var(--fg)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card>header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.sw.ring{background:none;border:2px solid}
#map{width:100%;position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
#map svg{display:block}
svg text{font-family:var(--font)}
.gridl{stroke:var(--line);stroke-width:1}
.axt{fill:var(--muted);font-size:10.5px}
.dA{fill:var(--tA)}.dB{fill:var(--tB)}.dC{fill:var(--tC)}
.dX{stroke:var(--tX);stroke-width:1.5;fill:none}
.thr{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.brush{fill:var(--accent);opacity:.12;stroke:var(--accent);stroke-width:1}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;white-space:nowrap;border:1px solid transparent;background:var(--surface2)}
.chip.rm{cursor:pointer}
.t{font-weight:600;min-width:22px;justify-content:center}
.t-A{background:var(--tA);color:var(--tA-fg)}
.t-B{background:var(--tBbg);color:var(--fg);border-color:var(--tB)}
.t-C{background:var(--tCbg);color:var(--muted)}
.t-X{background:var(--tXbg);color:var(--tX)}
.fl{background:var(--surface2);color:var(--fg);border-color:var(--line)}
.fl.sd{border-color:var(--sd);color:var(--sd)}
.fl.snp{border-color:var(--snp);color:var(--snp)}
.fl.info{color:var(--muted)}
.st-main{background:var(--accent);color:var(--accent-fg)}
.st-back{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.st-rej{background:var(--tXbg);color:var(--tX)}
.funnel{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 54px;gap:5px 10px;align-items:center}
.funnel .lab{font-size:12.5px;text-align:left;background:none;border:0;padding:3px 0;cursor:pointer;color:var(--fg)}
.funnel .lab:hover{color:var(--accent)}
.funnel .lab[aria-pressed=true]{font-weight:600;color:var(--accent)}
.funnel .bar{height:14px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.funnel .bar i{display:block;height:100%}
.funnel .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.funnel .gsep{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.tb{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:28px;padding:0 10px;border:0;background:var(--surface);cursor:pointer;border-right:1px solid var(--line);font-size:12.5px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;cursor:pointer}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.tbl{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font-weight:inherit}
.tbl th button[data-on=true]{color:var(--fg);font-weight:600}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:var(--surface2)}
.tbl tr.dd td{opacity:.6}
.tbl tr.open td{background:var(--accent-soft)}
.hebar{display:inline-block;width:64px;height:8px;background:var(--surface2);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.hebar i{display:block;height:100%}
.flags{display:flex;flex-wrap:wrap;gap:3px}
.more{margin-top:8px;text-align:center}
.empty{padding:22px;text-align:center;color:var(--muted)}
.tray{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:1100px){.tray{position:static;max-height:none}}
.it{border:1px solid var(--line);border-radius:6px;padding:7px 8px;margin-bottom:6px;background:var(--surface)}
.it .l1{display:flex;gap:6px;align-items:center;justify-content:space-between}
.it .l2{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.it select{height:24px;font-size:12px;max-width:100%;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px}
.x:hover{color:var(--bad)}
.sidecount{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.14);z-index:20;
  overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px}
.drawer[hidden]{display:none!important}
.drawer .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.drawer section{margin-top:16px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface2);border-radius:6px;padding:6px 8px}
.kv b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.kv span{font-size:11.5px;color:var(--muted)}
.ck{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px 8px;font-size:13px}
.ck .ic{font-weight:700;text-align:center}
.ck .ok{color:var(--ok)}.ck .warn{color:var(--warn)}.ck .bad{color:var(--bad)}.ck .info{color:var(--muted)}
.ck .d{color:var(--muted);font-size:12.5px;grid-column:2;margin-bottom:5px}
.seq{font-family:var(--mono);font-size:11.5px;line-height:1.6;word-break:break-all;background:var(--surface2);border-radius:6px;padding:8px;overflow-x:auto}
.seq .ln{display:block;white-space:nowrap}
.seq .p{color:var(--muted);display:inline-block;width:42px;user-select:none}
.sq-u{color:var(--fg)}.sq-l{color:var(--seqlow)}
.sq-L{background:var(--hl);color:var(--hl-fg);font-weight:600}
.sq-V{background:var(--vcz)}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip[hidden]{display:none!important}
table.plain{border-collapse:collapse;width:100%;font-size:12.5px}
.plain th,.plain td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.plain th{color:var(--muted);font-weight:500;white-space:nowrap}
.rb{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.rb label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
.rb select,.rb input{height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px;min-width:0}
.rb select{max-width:100%}
.rb select:disabled,.rb input:disabled{opacity:.55}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.step{display:inline-flex;gap:5px;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;background:var(--surface2);color:var(--muted)}
.step.on{background:var(--accent);color:var(--accent-fg)}
.step.ok{color:var(--fg)}
.step.err{background:var(--tXbg);color:var(--tX)}
.path{font-family:var(--mono);font-size:11.5px;word-break:break-all;user-select:all}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
textarea.json{width:100%;height:140px;font-family:var(--mono);font-size:11.5px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .14s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
</style>

<div class="app">
  <div class="top">
    <div>
      <h1 id="h1">STR 发现</h1>
      <div class="sub" id="geneLine"></div>
    </div>
    <div class="ctl" id="ctl">
      <label>分级版本<select id="verSel"></select></label>
      <label>A 级 He ≥<input id="thrA" type="number" step="0.01" min="0" max="1"></label>
      <label>B 级 He ≥<input id="thrB" type="number" step="0.01" min="0" max="1"></label>
      <span id="verBadge"></span>
      <button class="btn" data-act="thrReset">还原</button>
      <button class="btn" data-act="thrSave">保存为新分级版本</button>
    </div>
  </div>
  <div class="note" id="protoNote"></div>

  <div class="card" id="runbar" style="margin-bottom:14px"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabScreen" data-act="tab" data-v="screen">候选筛选</button>
    <button class="tab" role="tab" id="tabRecord" data-act="tab" data-v="record">记录与回溯</button>
  </div>

  <div id="viewScreen" class="layout">
    <div class="col">
      <div class="card">
        <header>
          <h2>基因组地图</h2>
          <div class="legend">
            <span><i class="sw" style="background:var(--tA)"></i>A</span>
            <span><i class="sw" style="background:var(--tB)"></i>B</span>
            <span><i class="sw ring" style="border-color:var(--sd)"></i>片段重复</span>
            <span><i class="sw ring" style="border-color:var(--snp)"></i>侧翼 SNP</span>
            <span><i class="sw ring" style="border-color:var(--accent)"></i>已入选（虚线 = 备选）</span>
            <span>空心 = 被去重</span>
            <label class="chk"><input type="checkbox" id="showC"> C 级</label>
            <label class="chk"><input type="checkbox" id="showX"> 排除</label>
          </div>
        </header>
        <div id="map"></div>
        <div class="muted" style="font-size:12px;margin-top:4px">纵轴 = HPRC256 的 He；在图上拖动可框选区间并过滤下方表格，点下方柱子（每 100 kb 的 A+B 数量）选中该区段，点圆点打开详情。</div>
      </div>

      <div class="card">
        <header><h2>筛选漏斗</h2><span class="muted" style="font-size:12px">点一行，表格按它过滤</span></header>
        <div class="funnel" id="funnel"></div>
      </div>

      <div class="card">
        <header><h2>候选位点</h2><span class="muted" style="font-size:12px" id="tblCount"></span></header>
        <div class="tb">
          <div class="seg" id="tfSeg"></div>
          <select id="sideSel" aria-label="位置">
            <option value="all">全部位置</option>
          </select>
          <input type="search" id="q" placeholder="搜索位点或 motif" aria-label="搜索">
          <label class="chk"><input type="checkbox" id="clean"> 只看无片段重复 / 无侧翼 SNP</label>
          <label class="chk"><input type="checkbox" id="showDd"> 显示被去重的位点</label>
          <span id="filtChips"></span>
        </div>
        <div class="tw"><table class="tbl">
          <thead><tr>
            <th></th>
            <th><button data-act="sort" data-k="prio">优先序</button></th>
            <th>分级</th>
            <th><button data-act="sort" data-k="pos">位点（染色体坐标）</button></th>
            <th><button data-act="sort" data-k="dist">位置 / 距基因</button></th>
            <th><button data-act="sort" data-k="he">He</button></th>
            <th><button data-act="sort" data-k="al">等位数</button></th>
            <th>旗标</th>
            <th>状态</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
        <div class="more" id="more"></div>
      </div>
    </div>

    <aside class="col">
      <div class="card tray" id="tray"></div>
    </aside>
  </div>

  <div id="viewRecord" hidden></div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="位点详情"></aside>
<div class="tip" id="tip" hidden></div>

  for (let v = y0; v <= 1.0001; v += (y0 ? 0.1 : 0.2)) { s += `<line class="gridl" x1="${ml}" x2="${ml + pw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axt" x="${ml - 6}" y="${Y(v) + 3.5}" text-anchor="end">${v.toFixed(1)}</text>`; }
  s += `<text class="axt" x="${narrow ? 4 : 6}" y="${mt - 3}">He</text>`;
  [[S.thr.A, "A"], [S.thr.B, "B"]].forEach(([v, n]) => { s += `<line class="thr" x1="${ml}" x2="${ml + pw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axt" x="${ml + pw - 3}" y="${Y(v) - 3}" text-anchor="end">${n} ≥ ${v}</text>`; });
  /* dots */
  const dots = {C: [], X: [], B: [], A: []};
  ALL.forEach(l => { const t = tOf(l); if (l.h == null) return; if (t === "C" && !S.showC) return; if (t === "X" && !S.showX) return; dots[t].push(l); });
  dots.C.forEach(l => { s += `<circle class="dC" data-id="${esc(l.i)}" cx="${X(l.s)}" cy="${Y(l.h)}" r="2" opacity=".45"/>`; });
  dots.X.forEach(l => { const x = X(l.s), y = Y(l.h); s += `<path class="dX" data-id="${esc(l.i)}" d="M${x - 3} ${y - 3}l6 6m0-6l-6 6"/>`; });
  ["B", "A"].forEach(t => dots[t].forEach(l => {
    const r = t === "A" ? 6 : 4.5, x = X(l.s), y = Y(l.h);
    s += l.dd ? `<circle data-id="${esc(l.i)}" cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${heColor(t)}" stroke-width="1.6" opacity=".75"/>`
              : `<circle class="d${t}" data-id="${esc(l.i)}" cx="${x}" cy="${y}" r="${r}"/>`;
    const ring = l.f.includes("SD") ? "var(--sd)" : l.f.includes("SNP") ? "var(--snp)" : null;
    if (ring) s += `<circle data-id="${esc(l.i)}" cx="${x}" cy="${y}" r="${r + 3}" fill="none" stroke="${ring}" stroke-width="1.6"/>`;
    const it = inList(l.i);
    if (it) s += `<circle data-id="${esc(l.i)}" cx="${x}" cy="${y}" r="${r + 6.5}" fill="none" stroke="var(--accent)" stroke-width="2.4"${it.role === "backup" ? ' stroke-dasharray="3 3"' : ""}/>`;
  }));
  /* gene lane */
  const gx0 = X(G.start), gx1 = X(G.end);
  s += `<text class="axt" x="${ml - 6}" y="${yGene + 10}" text-anchor="end">基因</text>`;
  const minus = G.strand === "-";
  s += minus ? `<path d="M${gx0 - 5} ${yGene + 6}L${gx0 + 2} ${yGene}V${yGene + 12}Z" fill="var(--gene)"/><rect x="${gx0 + 2}" y="${yGene}" width="${Math.max(2, gx1 - gx0 - 2)}" height="12" fill="var(--gene)"/>`
             : `<rect x="${gx0}" y="${yGene}" width="${Math.max(2, gx1 - gx0 - 2)}" height="12" fill="var(--gene)"/><path d="M${gx1 + 5} ${yGene + 6}L${gx1 - 2} ${yGene}V${yGene + 12}Z" fill="var(--gene)"/>`;
  s += `<text class="axt" x="${gx1 + 10}" y="${yGene + 10}" style="fill:var(--fg)">${esc(G.name)}（${minus ? "−链，转录向左" : "+链，转录向右"}）</text>`;
  /* segdup lane */
  s += `<text class="axt" x="${ml - 6}" y="${ySd + 10}" text-anchor="end">${narrow ? "SD" : "片段重复"}</text><line class="gridl" x1="${ml}" x2="${ml + pw}" y1="${ySd + 6}" y2="${ySd + 6}"/>`;
  D.segdups.forEach((d, i) => { s += `<rect data-sd="${i}" x="${X(d.s)}" y="${ySd}" width="${Math.max(2, X(d.e) - X(d.s))}" height="12" fill="var(--sd)" opacity=".8" rx="1"/>`; });
  /* bins */
  const bsz = 100000, b0 = Math.floor(W0 / bsz) * bsz, bins = [];
  for (let b = b0; b < W1; b += bsz) bins.push({b, A: 0, B: 0});
  ALL.forEach(l => { const t = tOf(l); if (t !== "A" && t !== "B") return; const k = Math.floor((l.s - b0) / bsz); if (bins[k]) bins[k][t]++; });
  const mx = Math.max(4, ...bins.map(b => b.A + b.B));
  s += `<text class="axt" x="${ml - 6}" y="${yBin + binH - 2}" text-anchor="end">A+B 数</text><line class="gridl" x1="${ml}" x2="${ml + pw}" y1="${yBin + binH}" y2="${yBin + binH}"/>`;
  bins.forEach((b, i) => {
    const x0 = X(Math.max(b.b, W0)), x1 = X(Math.min(b.b + bsz, W1)), w = Math.max(2, x1 - x0 - 2), hA = b.A / mx * binH, hB = b.B / mx * binH;
    s += `<rect data-bin="${i}" x="${x0}" y="${yBin}" width="${w}" height="${binH}" fill="transparent"/>`;
    if (b.B) s += `<rect data-bin="${i}" x="${x0 + 1}" y="${yBin + binH - hA - hB}" width="${w}" height="${hB}" fill="var(--tB)" rx="1.5"/>`;
    if (b.A) s += `<rect data-bin="${i}" x="${x0 + 1}" y="${yBin + binH - hA}" width="${w}" height="${hA}" fill="var(--tA)" rx="1.5"/>`;
    if (b.A + b.B) s += `<text class="axt" style="fill:var(--fg)" x="${x0 + 1 + w / 2}" y="${yBin + binH - hA - hB - 3}" text-anchor="middle">${b.A + b.B}</text>`;
  });
  /* axis */
  const step = narrow ? 500000 : 250000;
  for (let p = Math.ceil(W0 / step) * step; p <= W1; p += step) { s += `<line class="gridl" x1="${X(p)}" x2="${X(p)}" y1="${yAx - 16}" y2="${yAx - 12}"/><text class="axt" x="${X(p)}" y="${yAx}" text-anchor="middle">${(p / 1e6).toFixed(narrow ? 1 : 2)} Mb</text>`; }
  if (S.brush) { const a = X(S.brush[0]), b = X(S.brush[1]); s += `<rect class="brush" x="${a}" y="${mt}" width="${Math.max(2, b - a)}" height="${yBin + binH - mt}"/>`; }
  s += `<rect id="liveBrush" class="brush" x="0" y="${mt}" width="0" height="${yBin + binH - mt}" style="display:none"/>`;
  s += `<text class="axt" x="${ml}" y="${H - 1}" style="fill:var(--muted)">◀ ${G.arm === "q" ? "cen" : "pter"}</text><text class="axt" x="${ml + pw}" y="${H - 1}" text-anchor="end" style="fill:var(--muted)">${G.arm === "q" ? "qter" : "cen"} ▶</text>`;
  s += "</svg>";
  host.innerHTML = s;
  const svg = host.firstChild;
  /* interaction */
  const ptX = e => { const r = svg.getBoundingClientRect(); return e.clientX - r.left; };
  let drag = null;
  svg.addEventListener("pointerdown", e => {
    if (e.button !== 0) return; const x = ptX(e);
    drag = {x0: x, x1: x, t: e.target, moved: false};
  });
  svg.addEventListener("pointermove", e => {
    const x = ptX(e);
    if (drag) {
      drag.x1 = x; if (Math.abs(x - drag.x0) > 5) drag.moved = true;
      if (drag.moved) { const lb = svg.querySelector("#liveBrush"); const a = Math.max(ml, Math.min(drag.x0, x)), b = Math.min(ml + pw, Math.max(drag.x0, x)); lb.setAttribute("x", a); lb.setAttribute("width", Math.max(0, b - a)); lb.style.display = ""; hideTip(); return; }
    }
    const t = e.target;
    if (t.dataset && t.dataset.id) showTip(dotTip(BY[t.dataset.id]), e);
    else if (t.dataset && t.dataset.sd != null) { const d = D.segdups[+t.dataset.sd]; showTip(`片段重复 ${fmt(d.s)}–${fmt(d.e)}<br>另一拷贝 ${esc(d.o)} · 相似度 ${(d.f * 100).toFixed(1)}%`, e); }
    else if (t.dataset && t.dataset.bin != null) { const b = bins[+t.dataset.bin]; showTip(`${(b.b / 1e6).toFixed(1)}–${((b.b + bsz) / 1e6).toFixed(1)} Mb<br>A ${b.A} · B ${b.B}`, e); }
    else hideTip();
  });
  svg.addEventListener("pointerleave", hideTip);
  if (mapUp) window.removeEventListener("pointerup", mapUp);
  mapUp = function (e) {
    if (!drag) return; const d = drag; drag = null;
    if (!document.body.contains(svg)) return;
    if (d.moved) {
      const a = Math.max(ml, Math.min(d.x0, d.x1)), b = Math.min(ml + pw, Math.max(d.x0, d.x1));
      if (b - a > 4) { S.brush = [inv(a), inv(b)]; log("filter", "", `地图框选 ${G.chrom}:${fmt(S.brush[0])}–${fmt(S.brush[1])}`); renderAfterFilter(); }
      else renderMap();
    } else if (d.t.dataset && d.t.dataset.id) { openLocus(d.t.dataset.id); }
    else if (d.t.dataset && d.t.dataset.bin != null) { const b = bins[+d.t.dataset.bin]; S.brush = [b.b, b.b + bsz - 1]; renderAfterFilter(); }
    else if (S.brush) { S.brush = null; renderAfterFilter(); }
  };
  window.addEventListener("pointerup", mapUp);
}

/* ---------- funnel ---------- */
function renderFunnel() {
  const c = counts(), tot = ALL.length, ab = c.A + c.B;
  const pc = D.prio, reps = (pc[1] | 0) + (pc[2] | 0) + (pc[3] | 0) + (pc[4] | 0);
  const row = (label, n, den, colors, act, pressed) => {
    const bar = colors.map(([w, col]) => `<i style="width:${Math.max(w / den * 100, w > 0 ? 1.2 : 0)}%;background:${col}"></i>`).join("");
    return `<button class="lab" data-act="fun" data-v="${act}" aria-pressed="${pressed}">${label}</button><div class="bar">${bar}</div><div class="n">${fmt(n)}</div>`;
  };
  let h = row("TRExplorer 位点（motif 2–6）", tot, tot, [[tot, "var(--line)"]], "ALL", S.tf === "ALL" && !S.pcls);
  h += row("排除（拒绝 VC / 疾病位点）", c.X, tot, [[c.X, "var(--tX)"]], "X", S.tf === "X");
  h += row(`C 级（He < ${S.thr.B}）`, c.C, tot, [[c.C, "var(--tC)"]], "C", S.tf === "C");
  h += row("A + B 候选", ab, tot, [[c.A, "var(--tA)"], [c.B, "var(--tB)"]], "AB", S.tf === "AB" && !S.pcls);
  h += `<div class="gsep">以下按 A+B 候选 = 100% 的比例尺</div>`;
  h += row("A 级", c.A, ab, [[c.A, "var(--tA)"]], "A", S.tf === "A");
  h += row("B 级", c.B, ab, [[c.B, "var(--tB)"]], "B", S.tf === "B");
  h += row("去重后（重叠 / 同 VC 只留一个）", reps, ab, [[reps, "var(--accent)"]], "REPS", S.tf === "AB" && !S.showDd && false);
  [1, 2, 3, 4].forEach(k => { h += row(PCLS[k], pc[k] | 0, ab, [[pc[k] | 0, "var(--accent)"]], "P" + k, S.pcls === k); });
  $("#funnel").innerHTML = h;
}

/* ---------- table ---------- */
const TFS = [["AB", "A+B"], ["A", "A"], ["B", "B"], ["C", "C"], ["X", "排除"], ["ALL", "全部"]];
function filtered() {
  const q = S.q.trim().toLowerCase();
  let r = ALL.filter(l => {
    const t = tOf(l);
    if (S.tf === "AB" && t !== "A" && t !== "B") return false;
    if (["A", "B", "C", "X"].includes(S.tf) && t !== S.tf) return false;
    if (S.pcls && !(l.pr && l.pr[1] === S.pcls)) return false;
    if (S.side !== "all" && l.p !== +S.side) return false;
    if (S.clean && (l.f.includes("SD") || l.f.includes("SNP"))) return false;
    if (!S.showDd && l.dd) return false;
    if (S.brush && (l.e < S.brush[0] || l.s > S.brush[1])) return false;
    if (q && !l.i.toLowerCase().includes(q) && !l.m.toLowerCase().includes(q)) return false;
    return true;
  });
  const k = S.sort.k, d = S.sort.dir;
  const key = {prio: l => l.pr ? l.pr[0] : 1e6 + (l.dd ? 1e5 : 0) - (l.h || 0) * 1000, pos: l => l.s, dist: l => l.d, he: l => -(l.h == null ? -1 : l.h), al: l => -(l.a || 0)}[k];
  r.sort((a, b) => (key(a) - key(b)) * d);
  return r;
}
function statusChip(l) {
  const it = inList(l.i);
  if (it) return `<span class="chip ${it.role === "main" ? "st-main" : "st-back"}">${it.role === "main" ? "入选" : "备选"}</span>`;
  if (S.rejected[l.i]) return `<span class="chip st-rej" title="${esc(S.rejected[l.i])}">淘汰</span>`;
  if (l.dd) return `<span class="chip" title="${esc(l.dd)}">已去重</span>`;
  return "";
}
function renderTable() {
  const rows = filtered(), shown = rows.slice(0, S.limit);
  $("#tfSeg").innerHTML = TFS.map(([k, n]) => `<button data-act="tf" data-v="${k}" aria-pressed="${S.tf === k}">${n}</button>`).join("");
  document.querySelectorAll(".tbl th button").forEach(b => b.dataset.on = (b.dataset.k === S.sort.k));
  $("#tblCount").textContent = `${fmt(rows.length)} 个位点` + (rows.length > shown.length ? `，显示前 ${shown.length}` : "");
  let chips = "";
  if (S.brush) chips += `<span class="chip rm" data-act="clearBrush" title="清除区间">${G.chrom}:${fmt(S.brush[0])}–${fmt(S.brush[1])} ✕</span> `;
  if (S.pcls) chips += `<span class="chip rm" data-act="clearP" title="清除">${PCLS[S.pcls]} ✕</span>`;
  $("#filtChips").innerHTML = chips;
  $("#tbody").innerHTML = shown.length ? shown.map(l => {
    const t = tOf(l), it = inList(l.i), dis = t === "C" || t === "X";
    return `<tr class="r${l.dd ? " dd" : ""}${S.open === l.i ? " open" : ""}" tabindex="0" data-id="${esc(l.i)}">
      <td><input type="checkbox" data-act="pick" data-id="${esc(l.i)}" aria-label="加入入选清单" ${it ? "checked" : ""} ${dis ? "disabled" : ""}></td>
      <td>${prioChip(l)}</td><td>${tierChip(t)}</td>
      <td><span class="mono">${coord(l)}</span><br><span class="muted">(${esc(l.m)})n · ${l.z} bp</span></td>
      <td>${SIDE[l.p]}<br><span class="muted">${l.p === 1 ? "—" : dist(l)}</span></td>
      <td class="num"><span class="hebar"><i style="width:${(l.h || 0) * 100}%;background:${heColor(t)}"></i></span>${f2(l.h)}</td>
      <td class="num">${l.a == null ? "—" : l.a}</td>
      <td><div class="flags">${l.f.map(flagChip).join("") || '<span class="muted">—</span>'}</div></td>
      <td>${statusChip(l)}</td></tr>`;
  }).join("") : `<tr><td colspan="9" class="empty">当前过滤条件下没有位点。可以清除区间、放宽分级，或勾选“显示被去重的位点”。</td></tr>`;
  $("#more").innerHTML = rows.length > shown.length ? `<button class="btn" data-act="more">再显示 ${Math.min(200, rows.length - shown.length)} 个</button>` : "";
}

/* ---------- tray ---------- */
function renderTray() {
  const items = S.list.slice().sort((a, b) => BY[a.id].s - BY[b.id].s);
  const mains = items.filter(x => x.role === "main");
  const sc = [0, 1, 2].map(p => mains.filter(x => BY[x.id].p === p).length);
  let h = `<header><h2>入选清单</h2><span class="muted" style="font-size:12px">${mains.length} 主选 · ${items.length - mains.length} 备选</span></header>`;
  h += `<div class="sidecount">${[0, 1, 2].map(p => `<span class="chip">${SIDE[p]} ${sc[p]}</span>`).join("")}</div>`;
  if (!items.length) h += `<div class="empty">还没有入选的位点。在表格里勾选，或在详情里加入；也可以点“自动建议”，每 100 kb 区段挑一个主选和一个备选。</div>`;
  h += items.map(x => {
    const l = BY[x.id];
    return `<div class="it"><div class="l1"><span class="mono" style="font-size:12px">${fmt(l.s)}</span><span style="display:flex;gap:5px;align-items:center">${tierChip(tOf(l))}${prioChip(l)}<button class="x" data-act="rm" data-id="${esc(l.i)}" aria-label="移出">×</button></span></div>
      <div class="muted" style="font-size:12px">${SIDE[l.p]} ${l.p === 1 ? "" : dist(l)} · He ${f2(l.h)} · (${esc(l.m)})n${l.f.length ? " · " + l.f.map(f => FLAGS[f][0]).join("、") : ""}</div>
      <div class="l2"><div class="seg"><button data-act="role" data-id="${esc(l.i)}" data-v="main" aria-pressed="${x.role === "main"}">主选</button><button data-act="role" data-id="${esc(l.i)}" data-v="backup" aria-pressed="${x.role === "backup"}">备选</button></div>
      <select data-act="reason" data-id="${esc(l.i)}" aria-label="入选理由">${INC_REASONS.concat(x.reason && !INC_REASONS.includes(x.reason) ? [x.reason] : []).map(r => `<option${r === x.reason ? " selected" : ""}>${esc(r)}</option>`).join("")}</select>
      <button class="x" data-act="open" data-id="${esc(l.i)}" title="看详情" style="font-size:12px">详情</button></div></div>`;
  }).join("");
  const last = S.batches[S.batches.length - 1];
  h += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn" data-act="auto">自动建议</button><button class="btn" data-act="clearList" ${items.length ? "" : "disabled"}>清空</button>
    <button class="btn" data-act="export" ${items.length ? "" : "disabled"} title="把清单里每个位点的全部信息导出成 Excel">导出 Excel</button>
    <button class="btn pri" data-act="batch" ${mains.length ? "" : "disabled"} style="margin-left:auto">送去引物设计 →</button></div>`;
  if (S.msg) h += `<div class="note" style="margin:8px 0 0" role="status">${esc(S.msg)}</div>`;
  if (last) h += `<div class="muted" style="font-size:12px;margin-top:8px">最近批次 ${last.id}：${last.items.length} 个位点，${last.t.slice(0, 16).replace("T", " ")}。引物设计模块还没接入，批次存在“记录与回溯”。</div>`;
  h += `<div class="muted" style="font-size:12px;margin-top:8px">每侧要几个、间距多少由你在选的时候自己定，这里只统计数量。</div>`;
  $("#tray").innerHTML = h;
}

/* ---------- list actions ---------- */
function addToList(id, role, reason, src) {
  const l = BY[id]; if (!l || tOf(l) === "C" || tOf(l) === "X") return;
  const it = inList(id);
  if (it) { it.role = role || it.role; }
  else { S.list.push({id, role: role || "main", reason: reason || INC_REASONS[0], src: src || "手动"}); delete S.rejected[id]; }
  log(role === "backup" ? "backup" : "select", id, `${reason || INC_REASONS[0]}（${src || "手动"}）`);
}
function autoSuggest(src) {
  const b0 = Math.floor(W0 / 1e5) * 1e5, byBin = {};
  ALL.forEach(l => { if (!l.pr || l.pr[1] > 3 || l.dd) return; const t = tOf(l); if (t !== "A" && t !== "B") return; (byBin[Math.floor((l.s - b0) / 1e5)] = byBin[Math.floor((l.s - b0) / 1e5)] || []).push(l); });
  let n = 0;
  Object.keys(byBin).forEach(k => {
    const c = byBin[k].sort((a, b) => a.pr[1] - b.pr[1] || a.pr[0] - b.pr[0]).filter(l => !inList(l.i) && !S.rejected[l.i]);
    if (c[0]) { addToList(c[0].i, "main", "补位：该区段覆盖", src); n++; }
    if (c[1]) { addToList(c[1].i, "backup", "备选（同区段）", src); n++; }
  });
  return n;
}

/* ---------- drawer ---------- */
function checks(l) {
  const x = l.x, out = [];
  const add = (st, label, d) => out.push({st, label, d});
  if (l.f.includes("REJ")) add("bad", "变异簇", `过大（${x.vc ? x.vc.n : "?"} 个 TR），已排除`);
  else if (x.vc) add("warn", "变异簇 VC", `含 ${x.vc.n} 个 TR；引物禁区 ${G.chrom}:${fmt(x.vc.zone[0])}–${fmt(x.vc.zone[1])}`);
  else add("ok", "无变异簇", "引物禁区就是位点本身");
  add(l.mp != null && l.mp < 0.5 ? "warn" : "ok", "可比对性 " + (l.mp == null ? "—" : l.mp), l.mp != null && l.mp < 0.5 ? "低于 0.5，设计引物后必须 BLAST" : "≥ 0.5");
  if (x.nsd) add("bad", "片段重复", `侧翼与 ${x.nsd} 条片段重复重叠；最相似的另一拷贝 ${x.sd[0][0]}（${(x.sd[0][1] * 100).toFixed(1)}%）。引物要避开相似区并做 BLAST`);
  else add("ok", "不在片段重复里", "侧翼 ±200 bp 内没有 UCSC 片段重复");
  const sn = Math.max(x.s5, x.s3);

  if (c === "tool_error") return "本地服务报告失败：" + ((e && e.message) || "");

async function startRun() {

  if (flank < 50 || flank > 5000) { M.msg = "窗口范围要在 50 到 5000 kb 之间。"; renderRunbar(); return; }
  M.msg = ""; M.job = {gene, step: 0, state: "starting", steps: STEPS_DEFAULT, log: []}; renderRunbar();

async function pollJob() {

    const j = M.job;
    h += `<div class="steps">` + j.steps.map((n, i) => `<span class="step ${j.state === "error" && i === j.step ? "err" : i < j.step ? "ok" : i === j.step && j.state !== "done" ? "on" : ""}">${i < j.step ? "✓" : i === j.step && j.state !== "done" ? "▸" : "·"} ${esc(n)}</span>`).join("") + `</div>`;
    if (j.state === "error") h += `<div class="note" style="margin:8px 0 0" role="alert">运行失败：${esc(j.error || "")}${j.log && j.log.length ? "<br><span class=\"mono\">" + j.log.slice(-4).map(esc).join("<br>") + "</span>" : ""}</div>`;
  }
  if (M.msg) h += `<div class="note" style="margin:8px 0 0" role="status">${esc(M.msg)}</div>`;
  const f = M.files[RUNID];
  if (f && f.dir) {
    const files = (f.deliverables || []).map(p => `<div style="display:flex;gap:8px;align-items:flex-start;margin-top:4px"><span class="path" style="flex:1">${esc(p)}</span><button class="btn sm" data-act="copyPath" data-p="${esc(p)}">复制路径</button></div>`).join("");
    h += `<div style="margin-top:10px;font-size:12.5px"><b>本机文件</b>（${esc(RUNID)}；含原始 TRExplorer 窗口、UCSC 数据、脚本副本、Excel 和 Word）：<div class="path" style="margin-top:2px">${esc(f.dir)}</div>${files}</div>`;
  }
  $("#runbar").innerHTML = h;
}

/* ---------- load a run ---------- */
function applyData(data, runId) {
  D = data; G = data.gene; W0 = G.win[0]; W1 = G.win[1]; ALL = data.loci; BY = {}; ALL.forEach(l => { BY[l.i] = l; });
  SIDE = G.sides; RUNID = runId;
  FLAGS.GENE[2] = `位于 ${G.name} 基因内，可能与假基因或同源序列相似${G.pseudo ? "（" + G.pseudo + "）" : ""}`;
  base = {id: "v1", label: "默认", A: D.run.thresholds.HE_A, B: D.run.thresholds.HE_B, hash: D.run.tier_version, t: D.run.created, base: true};
  Object.assign(S, {vers: [base], active: "v1", thr: {A: base.A, B: base.B}, list: [], rejected: {}, events: [], batches: [],
    tf: "AB", pcls: null, side: "all", q: "", clean: false, showDd: false, sort: {k: "prio", dir: 1}, brush: null, open: null, limit: 120});
  const st = loadState(runId); let seeded = false;
  if (st) { ["vers", "active", "thr", "list", "rejected", "events", "batches"].forEach(k => { if (st[k] != null) S[k] = st[k]; }); seeded = true; }
  retier();
  if (!seeded) {
    if (runId === "builtin") { autoSuggest("示例（自动建议）"); log("auto", "", "首次打开：用自动建议生成示例入选清单，可清空"); }
    else log("run", "", `载入运行 ${runId}（${fmt(ALL.length)} 个位点，A ${D.counts.A} / B ${D.counts.B}）`);
  }
  $("#q").value = ""; $("#clean").checked = false; $("#showDd").checked = false;
  $("#sideSel").innerHTML = `<option value="all">全部位置</option>` + [0, 1, 2].map(p => `<option value="${p}">${esc(SIDE[p])}</option>`).join("");
  $("#protoNote").textContent = (runId === "builtin" ? `内置示例：${G.name} 的真实运行结果（脚本 ${D.run.script.version.split(" ")[0]}），不连本地服务也能看。` : `本机运行 ${runId}，由本地服务生成。`) +
    "入选清单和记录只保存在本浏览器里，换设备或清缓存会丢，Excel 导出才是带走的记录。引物设计和多重 CE 还没接入，“送去引物设计”只生成批次记录。";
  if (!M.gene) M.gene = G.name;
  try { localStorage.setItem(LASTKEY, runId); } catch (e) {}
  renderAll(); renderRunbar();
}

/* ---------- init ---------- */
let LAST0 = null; try { LAST0 = localStorage.getItem(LASTKEY); } catch (e) {}      // the run to reopen, read before the built-in data overwrites it
applyData(BUILTIN, "builtin");
(async function autoConnect() {
  try {
    const perm = window.claude && window.claude.use ? await window.claude.use("permissions") : null;
    if (!perm || (await perm.state("mcp:" + SRV)) !== "granted") return;
    await connectSvc();
    if (M.state === "ready" && LAST0 && LAST0 !== "builtin" && M.runs.some(r => r.run_id === LAST0)) await loadRun(LAST0);
  } catch (e) {}
})();
})();
</script>
